# cargo-packager configuration for the Linux .deb and AppImage and the Windows
# setup.
# `cargo xtask package linux|windows` fills in @VERSION@ (the workspace
# version) and @ROOT@ (the repository root in the build container), writes the
# result to target/packager/Packager.toml and runs cargo-packager on it. The
# macOS bundle is assembled by xtask itself (xtask/src/macos.rs).
name = "ircord"
productName = "IRCord GPUI"
version = "@VERSION@"
identifier = "com.ircord.gpui"
description = "Experimental native IRCord desktop client"
longDescription = """
A native IRCord client written in Rust with GPUI. It talks to an IRCord \
server over the same HTTP and WebSocket API as the web client. It is \
experimental and not ready for daily use; the supported desktop app is \
IRCord (github.com/ircord/desktop)."""
homepage = "https://github.com/ircord/frontend-gpui"
publisher = "IRCord"
# The .deb's Maintainer field.
authors = ["IRCord"]
category = "SocialNetworking"
binariesDir = "@ROOT@/dist"
icons = [
    "@ROOT@/packaging/linux/ircord.png",
    "@ROOT@/packaging/windows/ircord.ico",
]
binaries = [{ path = "ircord", main = true }]
deepLinkProtocols = [{ schemes = ["irc", "ircs"] }]

[deb]
packageName = "ircord-gpui"
section = "net"
depends = [
    "libc6 (>= 2.35)",
    "libasound2",
    "libvulkan1",
    "mesa-vulkan-drivers | vulkan-icd",
    "libxcb1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libwayland-client0",
    "gstreamer1.0-plugins-base",
    "gstreamer1.0-plugins-good",
    "gstreamer1.0-libav",
]

# The video helper sits beside the app, and the menu entry and icons are the
# repository's own: the app registers itself as com.ircord.gpui.desktop.
[deb.files]
"@ROOT@/dist/ircord-video" = "usr/bin/ircord-video"
"@ROOT@/packaging/linux/com.ircord.gpui.desktop" = "usr/share/applications/com.ircord.gpui.desktop"
"@ROOT@/packaging/linux/ircord.svg" = "usr/share/icons/hicolor/scalable/apps/com.ircord.gpui.svg"
"@ROOT@/packaging/linux/ircord.png" = "usr/share/icons/hicolor/256x256/apps/com.ircord.gpui.png"

# The AppImage carries the same files as the .deb. Inside it the menu entry
# is ircord.desktop: cargo-packager links the AppImage's own entry to
# usr/share/applications/<binary>.desktop. Video uses the system's GStreamer
# (the app says what to install when it is missing), so GStreamer, the GLib
# under it and what those two need stay out of the AppImage, as do X's own
# libraries: a library bundled here would also be what the programs the app
# starts (xdg-open, zenity) load. What is left is libxkbcommon.
[appimage]
excludedLibs = [
    "libgst*",
    "libglib-2.0*",
    "libgobject-2.0*",
    "libgmodule-2.0*",
    "libgio-2.0*",
    "liborc-0.4*",
    "libffi*",
    "libpcre2*",
    "libmount*",
    "libblkid*",
    "libselinux*",
    "libdw*",
    "libelf*",
    "libunwind*",
    "liblzma*",
    "libbz2*",
    "libXau*",
    "libXdmcp*",
    "libbsd*",
    "libmd*",
]

[appimage.files]
"@ROOT@/dist/ircord-video" = "usr/bin/ircord-video"
"@ROOT@/packaging/linux/com.ircord.gpui.desktop" = "usr/share/applications/ircord.desktop"
"@ROOT@/packaging/linux/ircord.svg" = "usr/share/icons/hicolor/scalable/apps/com.ircord.gpui.svg"
"@ROOT@/packaging/linux/ircord.png" = "usr/share/icons/hicolor/256x256/apps/com.ircord.gpui.png"

[linux]
generateDesktopEntry = false

[nsis]
installMode = "currentUser"
