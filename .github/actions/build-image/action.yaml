name: Build image
description: >-
  Load the build container from tools/build.Dockerfile under the name
  `cargo xtask` looks for, with its layers cached in GitHub's cache, and make
  room on the runner for it and a release build.
runs:
  using: composite
  steps:
    - name: Make room on the runner
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h / | tail -n1
    - id: tag
      name: Name the image
      shell: bash
      run: echo "tag=$(cargo xtask image-tag)" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: tools
        file: tools/build.Dockerfile
        tags: ${{ steps.tag.outputs.tag }}
        load: true
        cache-from: type=gha,scope=build-image
        cache-to: type=gha,scope=build-image,mode=max
