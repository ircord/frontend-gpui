[package]
name = "ircord-platform"
description = "What IRCord asks of the operating system besides drawing: sound out, video decoding, notifications, message boxes. No GPUI."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
log = "0.4"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "mp4", "vorbis", "flac", "wav"] }
semver = "1"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# A Linux AppImage installs updates as Windows and macOS do. rustls here, as
# reqwest below: the build container compiles its C for Linux.
cargo-packager-updater = { version = "=0.2.3", default-features = false, features = ["rustls-tls"] }
notify-rust = "4.19"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"

# Windows and macOS check, download and install through the packager's updater
# (as does a Linux AppImage, above).
# Its default TLS is rustls, whose `ring` compiles C that the Linux build
# container cannot cross-compile for macOS; the OS's TLS stack needs no C.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cargo-packager-updater = { version = "=0.2.3", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation", "Foundation_Collections",
    "Media_Core", "Media_Playback",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT_Direct3D11",
    "Data_Xml_Dom", "UI_Notifications",
    "Win32_UI_WindowsAndMessaging",
] }
windows-registry = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSURL", "NSDictionary", "NSValue", "NSArray", "NSError"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVAsset", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3.2", features = ["CMTime"] }
objc2-core-video = { version = "0.3.2", features = ["CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-foundation = "0.3.2"
objc2-user-notifications = { version = "0.3.2", features = ["std", "block2", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationAttachment", "UNUserNotificationCenter", "UNNotificationTrigger", "UNNotification"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
base64 = "0.22"
minisign = "0.7"
