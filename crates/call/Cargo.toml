[package]
name = "ircord-call"
description = "Voice calls on the IRCord server's LiveKit: the media connection, the microphone and the speakers. No GPUI."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ircord-client.workspace = true
log = "0.4"
url.workspace = true
tokio = { version = "1", features = ["rt", "sync", "macros"] }
# The media connection, with WebRTC's own audio device module (microphone,
# speakers, echo cancellation). Its prebuilt libwebrtc needs clang 21 to
# build; it compiles Objective-C++ for macOS, which the Linux container
# cannot, so this crate is checked for macOS only on the CI Mac.
livekit = { version = "=0.12.1", default-features = false, features = ["native", "rustls-tls-webpki-roots"] }
