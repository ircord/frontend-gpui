[package]
name = "ircord-client"
description = "IRCord client core: HTTP, the event socket, the state store and persistence. No GPUI."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# The canned server and fixture builders in `testing`, for this crate's and the app's tests.
test-support = []

[dependencies]
ircord-contract.workspace = true
anyhow.workspace = true
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
url.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
cssparser = "0.38"
csscolorparser = { version = "0.9", default-features = false, features = ["std", "named-colors"] }
dirs = "6"
futures = "0.3"
html5ever = "0.27"
http = "1"
iana-time-zone = "0.1"
icu_locale = { version = "~2.4.0", features = ["unstable"] }
icu_properties = "~2.4.0"
jiff = "1"
keyring = "=4.2.0"
log = "0.4"
markup5ever_rcdom = "0.3"
# Mermaid fences as diagrams: the 13 families readable in a host theme,
# laid out with Cytoscape. ELK (EPL-2.0) is left out.
merman = { version = "=0.11.0", default-features = false, features = [
    "svg",
    "layout-cytoscape",
    "diagram-class",
    "diagram-er",
    "diagram-flowchart",
    "diagram-gantt",
    "diagram-git-graph",
    "diagram-journey",
    "diagram-mindmap",
    "diagram-pie",
    "diagram-quadrant-chart",
    "diagram-sequence",
    "diagram-state",
    "diagram-timeline",
    "diagram-xychart",
] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
rusqlite = { version = "0.41", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
unicode-normalization = "0.1"
unicode-script = "0.5"
unicode-segmentation = "1"
webpki-roots = "1"
