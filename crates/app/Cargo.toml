[package]
name = "ircord-app"
description = "IRCord desktop client built with GPUI"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ircord"
path = "src/main.rs"

[dependencies]
ircord-client.workspace = true
ircord-contract.workspace = true
anyhow.workspace = true
gpui-kit = "=0.10.0"

[dev-dependencies]
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
