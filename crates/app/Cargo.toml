[package]
name = "ircord-app"
description = "IRCord GPUI client built with GPUI"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
hot-reload = ["dep:gpui-pre", "gpui-pre/hot-reload"]

[[bin]]
name = "ircord"
path = "src/main.rs"

[dependencies]
# The node type GPUI's accessibility tree is built from, for the live
# region that announces new messages (timeline/announce.rs). Keep it the
# version gpui-kit uses.
accesskit = "0.24"
ircord-client.workspace = true
ircord-platform = { path = "../platform" }
anyhow.workspace = true
url.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
env_logger = "0.11"
futures = "0.3"
gpui-kit = "=0.10.0"
# Match gpui-kit's snapshot so Cargo enables hot-patching on the same GPUI.
gpui-pre = { version = "=0.3.12", default-features = false, optional = true }
# Frame types only, to hold an animated picture on its first frame.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
dirs = "6"
log = "0.4"
# Diagrams (message/diagram.rs): the SVG to a picture, with text measured
# in the drawn font. The versions GPUI already links.
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts"] }
rustybuzz = "0.20"
tokio = { version = "1", features = ["rt"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26"

# On Linux the tray is a StatusNotifierItem on the session bus (KSNI), which
# needs no GTK; zbus asks the bus whether a tray host is running.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# The Windows icon and version resource (see build.rs).
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
ircord-client = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
