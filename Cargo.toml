[workspace]
resolver = "3"
members = ["crates/contract", "crates/client", "crates/app", "crates/dev", "crates/platform", "crates/video-gst", "xtask"]
default-members = ["crates/contract", "crates/client", "crates/app"]

[workspace.package]
version = "0.10.1"
edition = "2024"
publish = false

[workspace.dependencies]
ircord-contract = { path = "crates/contract" }
ircord-client = { path = "crates/client" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# GPUI's Windows backend compiles its shaders with fxc.exe in build.rs, which
# only runs when the build machine is Windows. The vendored copy compiles the
# same HLSL at start-up instead, so the .exe can be cross-built on Linux.
# See vendor/README.md before bumping gpui-kit.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.release]
debug = false
strip = true

# Dev and test builds. Line tables keep file and line numbers in panics and
# backtraces and halve `target/debug`; set CARGO_PROFILE_DEV_DEBUG=2 to step
# through variables in a debugger.
[profile.dev]
debug = "line-tables-only"

# The headless UI tests spend their time inside GPUI, text shaping and image
# decoding, which at opt-level 0 cost 11 CPU-minutes a run. These crates are
# optimised once per dependency change (sccache keeps the result); workspace
# crates stay unoptimised and incremental. Named rather than `package."*"` so
# proc macros and build scripts, which sccache cannot cache, stay unoptimised.
# A dependency missing from this list is only slower, never wrong; a name that
# leaves the dependency graph (after a gpui-kit bump, say) makes cargo warn on
# every build, and should be removed then.
[profile.dev.package.gpui-pre]
opt-level = 1

[profile.dev.package.gpui-pre-platform]
opt-level = 1

[profile.dev.package.gpui-pre-linux]
opt-level = 1

[profile.dev.package.gpui-pre-wgpu]
opt-level = 1

[profile.dev.package.gpui-pre-scheduler]
opt-level = 1

[profile.dev.package.gpui-pre-sum-tree]
opt-level = 1

